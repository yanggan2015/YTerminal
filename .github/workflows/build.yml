name: build

on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup MSYS2
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: mingw-w64-x86_64-gcc

      - name: Show toolchain
        shell: pwsh
        run: |
          $env:PATH = "C:\msys64\mingw64\bin;$env:PATH"
          gcc --version

      - name: Build
        shell: pwsh
        run: |
          $env:PATH = "C:\msys64\mingw64\bin;$env:PATH"
          ./build.ps1

      - name: Unit tests (VT core)
        shell: pwsh
        run: |
          $env:PATH = "C:\msys64\mingw64\bin;$env:PATH"
          gcc -std=c11 -O2 -Wall -I src tests/test_vt.c src/vt.c src/util.c -o build/test_vt.exe -lkernel32
          ./build/test_vt.exe

      - name: Unit tests (core)
        shell: pwsh
        run: |
          $env:PATH = "C:\msys64\mingw64\bin;$env:PATH"
          gcc -std=c11 -O2 -Wall -I src tests/test_core.c src/core.c src/util.c -o build/test_core.exe -lkernel32
          ./build/test_core.exe

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: YTerminal-win64
          path: |
            build/YTerminal.exe
            build/YTPass.exe
          if-no-files-found: error
