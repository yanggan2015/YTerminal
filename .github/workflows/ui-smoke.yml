name: ui-smoke

# 界面冒烟测试：需要交互式桌面会话，GitHub 托管 runner 不保证可用，
# 因此只做手动触发，避免污染主分支 CI。
on:
  workflow_dispatch:

jobs:
  ui:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup MSYS2
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: mingw-w64-x86_64-gcc
      - name: Build
        shell: pwsh
        run: |
          $env:PATH = "C:\msys64\mingw64\bin;$env:PATH"
          ./build.ps1
      - name: UI smoke
        shell: pwsh
        run: ./scripts/ui-smoke.ps1
      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-smoke-screens
          path: docs/images/*.png
          if-no-files-found: ignore